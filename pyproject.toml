# Project configuration for the fleet's own tooling. The plugin the repository ships needs none of
# this: Claude Code loads `agents/`, `skills/`, and `hooks/hooks.json` directly, and the two hooks run
# under `python -I -S` with the standard library only (AGENTS.md, "Keep isolated hooks
# dependency-free"). Everything declared here serves the maintainer loop -- the validator, the
# generator, the probes, and the tests -- and is installed with `uv sync` or the pinned `pip`
# line in `.github/workflows/validate.yml`.
[project]
name = "homelab-agents-tooling"
version = "0"
description = "Maintainer tooling for the sde-agents fleet (not the plugin itself)"
requires-python = ">=3.11"
# No runtime dependencies, deliberately: the scripts must keep running from a bare interpreter
# so a contributor without the dev group installed still gets the T0 gate.
dependencies = []

[dependency-groups]
dev = [
    # Lint and formatting gate; version pinned so CI and the edit loop agree byte-for-byte.
    "ruff==0.16.7",
    # Test runner that executes the existing unittest suite unchanged and adds -k, --durations
    # on every supported Python, and fixtures for the kernel tests.
    "pytest==9.1.1",
    # A CONFORMING YAML parser, used only as a differential tripwire against the fleet's own
    # frontmatter dialect (tests/test_fleet_frontmatter.py). It is never the reader: the hosts
    # that load the definitions are the oracle, and they are not conforming parsers either.
    "pyyaml==6.0.3",
    # Property-based tests over the two places hostile input has the highest value: the guard's
    # command tokenizer and the frontmatter dialect. Its first run found a guard bypass a
    # hand-written corpus had missed for the life of the guard (`ls;(rm -rf /)`), which is the
    # argument for the dependency. Skips loudly where absent, like pyyaml above; CI installs it.
    "hypothesis==6.168.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The nested worktree home and the probe workspace are other writers' trees (tests/support.py).
# `skills/**` holds fleet CONTENT (a CLI skeleton and an error-budget script a skill hands to its
# user), and `.github/skills` and `plugins/` are its generated copies: none of it is the
# maintainer tooling this gate covers, and linting a generated copy would demand an edit the
# generator forbids.
extend-exclude = [".claude/worktrees", ".probe-tmp", "skills", ".github/skills", "plugins"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Findings the legacy modules carried when the gate was introduced (2026-09-13). The lint gate
# enforces the full rule set on every new module; a legacy module leaves this table when it is
# migrated onto the kernel and cleaned in the same change. Never widen an entry to keep a new
# finding quiet -- fix the finding or move the module here with the code it actually violates.
#
# What is left is no longer a backlog. Each of the three is exempted for a stated reason:
#
# * probe_plugin holds the probe's live-model stimulus -- a prompt and a workflow source -- in
#   triple-quoted constants whose long physical lines cannot carry a `noqa`, and cannot be
#   rewrapped without changing what the probe measures and breaking comparability with the
#   recorded probe evidence. Reflowing a measurement to satisfy a formatter is the wrong trade.
# * The two hook scripts' long lines ARE reflowable -- they are comments and code, not output
#   bytes -- but editing either is a hook change under AGENTS.md's hook playbook and owes a
#   `probe_plugin.py` run. Spending a live probe to rewrap comments in the fleet's security
#   boundary is the wrong trade, for the same reason `[tool.ruff.format]` below excludes them.
#
# Operator ruling, 2026-09-14: all three exemptions are PERMANENT, and MACH-001's acceptance
# criterion is amended from "the table is empty" to "every entry states why it is exempt". Adding
# a fourth entry still requires the same justification -- this is not a reopened backlog.
[tool.ruff.lint.per-file-ignores]
"scripts/live-effect-gate.py" = ["E501"]
"scripts/probe_plugin.py" = ["E501"]
"scripts/readonly-guard.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fleet", "scripts", "tests"]

[tool.ruff.format]
# Formatting is enforced on the kernel package only until the legacy modules migrate; a
# whole-tree reformat would bury the migration diffs and touch the two hook scripts for no
# behavioral reason.
exclude = ["scripts/*", "tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The suite runs from the repository root so `from scripts import ...`, `from tests.support import
# ...`, and `import fleet` all resolve to one module identity each (tests/support.py docstring).
pythonpath = ["."]
addopts = "-q"
